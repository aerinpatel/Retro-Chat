version: '3.8'

services:
  # 1. MongoDB Database Container
  mongodb:
    image: mongo:latest
    container_name: chat_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 2. Node.js Express & WebSocket Server Container
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chat_server
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongodb:27017/chatv1
      - ACCESS_TOKEN_SECRET=access_secret_123
      - REFRESH_TOKEN_SECRET=refresh_secret_456
    depends_on:
      - mongodb

volumes:
  mongo_data:
