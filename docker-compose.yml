services:
  # 1. MongoDB Database Container
  mongodb:
    image: mongo:latest
    container_name: cathode_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 2. Redis Container
  redis:
    image: redis:alpine
    container_name: cathode_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. Node.js Express & WebSocket Server Container
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cathode_server
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongodb:27017/cathode
      - REDIS_URL=redis://redis:6379
      - ACCESS_TOKEN_SECRET=access_secret_123
      - REFRESH_TOKEN_SECRET=refresh_secret_456
    depends_on:
      - mongodb
      - redis

volumes:
  mongo_data:
  redis_data:

